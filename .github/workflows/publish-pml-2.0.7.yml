name: Publicar APK verificado 2.0.7
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-pml-2.0.7.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-pml-2.0.7
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo}=context.repo;
            const expected='28b55b71c593006c5e64bf4999e9dba0417a4bf7661c1fdc2134774dc328f0e8';
            const chunks=[];
            for(const part of [1,2]){
             const response=await fetch('https://0a987642.promobileleague.pages.dev/downloads/pml-v207-28b55b71c593-part'+part);
             if(!response.ok)throw new Error('APK download failed: '+response.status);
             chunks.push(Buffer.from(await response.arrayBuffer()));
            }
            const apk=Buffer.concat(chunks);
            if(require('node:crypto').createHash('sha256').update(apk).digest('hex')!==expected)throw new Error('APK checksum mismatch');
            let release;
            try{release=(await github.rest.repos.getReleaseByTag({owner,repo,tag:'v2.0.7'})).data;}catch(e){if(e.status!==404)throw e;}
            if(release&&!release.draft){core.notice('Already published; left unchanged.');return;}
            const body="Canal: PML-TORNEOS\nPaquete: com.promobileleague.torneos\nVersión: 2.0.7\nCódigo: 46\nSHA-256 APK: 28b55b71c593006c5e64bf4999e9dba0417a4bf7661c1fdc2134774dc328f0e8\n\nModeradores: gestión de equipos, escudos, fotos de jugadores y DT sin perder permisos al vincularse a un equipo. Eliminar jugador con confirmación, conservando la atribución de estadísticas históricas. Encabezados del medallero en mayúsculas.\n\nPruebas de permisos, eliminación, conservación de eventos y regresión de sincronización aprobadas. Firma e integridad del APK verificadas. Las reglas de Firebase fueron publicadas por el propietario; falta validación con cuentas reales y dispositivo Android.\n\nInstalar sobre PML Torneos sin desinstalar. Android 7 o posterior.";
            if(!release)release=(await github.rest.repos.createRelease({owner,repo,tag_name:'v2.0.7',target_commitish:context.sha,name:'PML Torneos 2.0.7',body,draft:true,prerelease:false})).data;
            const assets=(await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id})).data;
            for(const asset of assets)if(asset.name==='Pro-Mobile-League.apk')await github.rest.repos.deleteReleaseAsset({owner,repo,asset_id:asset.id});
            const uploaded=(await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name:'Pro-Mobile-League.apk',data:apk,headers:{'content-type':'application/vnd.android.package-archive','content-length':apk.length}})).data;
            if(uploaded.size!==apk.length)throw new Error('Incomplete APK upload');
            await github.rest.repos.updateRelease({owner,repo,release_id:release.id,body,draft:false,prerelease:false,make_latest:'true'});
            core.notice('Published verified APK: '+release.html_url);
